[pytest]
testpaths = tests
addopts = -ra --strict-markers
markers =
    unit: CPU-only, runs anywhere in under ~2 s. Runs by default and in CI.
        Tests with no marker at all are treated as `unit` (see tests/conftest.py).
    pipeline: Runs real Atomizer stages on small meshes. Needs the operator's
        laptop (GPU + Blender). Skipped unless --run-pipeline is passed.
    benchmark: Full runs on the benchmark parts. Needs the operator's laptop and
        may take a long time. Skipped unless --run-benchmark is passed.
