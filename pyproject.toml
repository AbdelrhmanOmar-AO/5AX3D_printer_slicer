[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "atom"
version = "0.1.0"
authors = [
    {name = "Xavier Chermain", email = "xavier.chermain@inria.fr"},
]
description = "Mesh Atomizer"
readme = "README.md"
requires-python = ">=3.7, <3.11"
keywords = ["graphics", "fabrication"]
license = {file = "LICENSE"}
dependencies = [
    "numpy",
    "pyvista",
    "taichi",
    "tqdm",
    "Pillow",
    "typing_extensions>=4.0",
]

[project.optional-dependencies]
# Kept in sync with requirements-dev.txt.
dev = [
    "pytest>=8.0,<10.0",
    "pytest-timeout>=2.3,<3.0",
    "trimesh>=4.0,<6.0",
    "scipy>=1.10,<2.0",
    "jsonschema>=4.0,<5.0",
]
# The Qt window of tools/visualize_5ax.py. Optional: without it the viewer
# falls back to the classic pyvista window. On the laptop install with
#   conda install -c conda-forge pyside6 pyvistaqt
gui = [
    "PySide6>=6.5",
    "pyvistaqt>=0.11",
]
